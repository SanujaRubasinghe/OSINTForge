planner:
  model: qwen2.5:3b
  temperature: 0
  max_tokens: 2048
  timeout_s: 60
  max_retries: 2

entity_extractor:
  spacy_model: en_core_web_trf
  llm_model: qwen2.5:3b
  temperature: 0
  batch_size: 5
  max_tokens: 1024
  timeout_s: 90

synthesis:
  model: claude-sonnet-4-20250514
  max_tokens: 4096
  timeout_s: 120

critic:
  model: claude-sonnet-4-20250514
  max_tokens: 1024
  timeout_s: 60
  max_refinement_passes: 3
  confidence_threshold: 0.65

image_intel:
  vision_model: claude-sonnet-4-20250514
  max_tokens: 1024
  ocr_enabled: true
  logo_detection_enabled: false
  reverse_search_enabled: true
