services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       osintforge
      POSTGRES_USER:     osint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osintpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d osintforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: "24h"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:     postgresql://osint:${POSTGRES_PASSWORD:-osintpass}@postgres:5432/osintforge
      REDIS_URL:        redis://redis:6379/0
      OLLAMA_BASE_URL:  http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_TOKEN:     ${GITHUB_TOKEN:-}
      NEWSAPI_KEY:      ${NEWSAPI_KEY:-}
      SHODAN_API_KEY:   ${SHODAN_API_KEY:-}
    volumes:
      - ./:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://api:8000
    volumes:
      - ./:/app
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_models:
